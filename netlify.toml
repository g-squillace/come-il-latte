[build]
  command = "yarn build"
  functions = "netlify/functions"
  publish = ".next"

[[redirects]]
  from = "https://comeillatte.netlify.app/*"
  to = "https://comeillatte.it/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/it"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/it/*"
  to = "/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
